[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floability-remote"
version = "0.1.0"
description = "Run Floability backpacks on remote systems over OpenSSH"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
floability-remote = "floability_remote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["floability_remote*"]

[tool.setuptools.package-data]
"floability_remote.web" = [
    "static/*.html",
    "static/css/*.css",
    "static/img/*.png",
    "static/js/*.js",
]
