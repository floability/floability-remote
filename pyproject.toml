[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floability-remote"
version = "0.1.0"
description = "Run Floability backpacks on remote systems over OpenSSH"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
floability-remote = "floability_remote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["floability_remote*"]
